name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, 'develop/**', 'ralph/**', 'wu/**']

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEMO_MODE: 'false'
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef
      SMTP_HOST: smtp.invalid
      SMTP_FROM: ci@careerpilot.invalid
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      AI_CREDENTIAL_MASTER_KEY: ci-only-ai-key-abcdef0123456789xyz
      DB_TYPE: postgresql
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/careerpilot_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Unit, security, billing, and migration tests
        run: pnpm test
      - name: Production build
        run: pnpm build
