name: Feature Request / 功能建议
description: Suggest a focused improvement / 提出明确的改进建议
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，未发现相同建议。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述用户、场景和当前痛点。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 请描述理想流程或行为，不必提供完整技术设计。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 你尝试过的替代办法或可接受的简化方案。

  - type: dropdown
    id: priority
    attributes:
      label: 影响程度
      options:
        - 小幅体验改进
        - 影响常用流程
        - 阻塞关键流程
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供已脱敏截图、原型或相关链接。
