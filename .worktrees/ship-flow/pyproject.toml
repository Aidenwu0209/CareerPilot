[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-ship-flow"
version = "0.1.0"
description = "A durable, reviewable Git shipping workflow for Codex"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ship = "ship_flow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
